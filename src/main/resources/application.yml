# Loads `.env` as a properties source when it exists, so the same file configures Docker
# Compose and the application. `optional:` keeps the context loadable without it.
spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: card-drafting-service
  threads:
    virtual:
      enabled: true

  # The application defines its own DataSource bean from these, which switches off Boot's
  # datasource autoconfiguration. One source of truth, validated at startup.
  db:
    url: ${CARD_DB_URL:jdbc:postgresql://127.0.0.1:5432/card}
    username: ${CARD_DB_USER:card}
    password: ${CARD_DB_PASSWORD:card}
    pool-size: ${CARD_DB_POOL_SIZE:10}
    connection-timeout: ${CARD_DB_CONNECTION_TIMEOUT:5s}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  ai:
    openai:
      # The /v1 suffix is required. Without it the SDK posts to /chat/completions, and this
      # server answers HTTP 200 with an error object rather than a 404 — so the failure surfaces
      # as "choices is not set" rather than as a wrong-address error. Same class of trap as the
      # chat-completions versus responses split, and worth knowing before debugging it twice.
      base-url: ${CARD_LLM_BASE_URL:http://127.0.0.1:1234/v1}
      api-key: ${CARD_LLM_API_KEY:lm-studio}
      chat:
        # A local reasoning model answers in tens of seconds; the ceiling bounds one request so
        # a hung call cannot occupy a worker slot forever.
        timeout: ${CARD_LLM_TIMEOUT:120s}
        # Our client owns retry classification and writes the call record itself (ADR-0005).
        # Leaving either retry layer enabled would multiply attempts: a three-attempt loop over
        # a retrying client is up to nine requests to the provider, and nine times the bill.
        max-retries: 0
  # Spring AI's own retry template, disabled for the same reason.
  retry:
    max-attempts: 1

card:
  llm:
    main-model: ${CARD_LLM_MAIN_MODEL:qwen/qwen3.5-9b}
    utility-model: ${CARD_LLM_UTILITY_MODEL:qwen/qwen3-4b-2507}
    timeout: ${CARD_LLM_TIMEOUT:120s}
    max-attempts: ${CARD_LLM_MAX_ATTEMPTS:3}
    retry-base-delay: ${CARD_LLM_RETRY_BASE_DELAY:500ms}
    retry-max-delay: ${CARD_LLM_RETRY_MAX_DELAY:8s}
    max-repair-attempts: ${CARD_LLM_MAX_REPAIR_ATTEMPTS:2}

    # Prices per million tokens, per tier, as exact decimals. Zero for a local model; set the
    # reference cloud price of the same model to make the breakdown meaningful without moving
    # off-device. Zero is a real value and means free - an absent price is refused, because "nobody
    # decided" and "this costs nothing" are opposite answers and only one is safe.
    main-input-price-per-million: ${CARD_LLM_MAIN_INPUT_PRICE_PER_MILLION:0}
    main-output-price-per-million: ${CARD_LLM_MAIN_OUTPUT_PRICE_PER_MILLION:0}
    utility-input-price-per-million: ${CARD_LLM_UTILITY_INPUT_PRICE_PER_MILLION:0}
    utility-output-price-per-million: ${CARD_LLM_UTILITY_OUTPUT_PRICE_PER_MILLION:0}

  generation:
    max-rewrite-rounds: ${CARD_GENERATION_MAX_REWRITE_ROUNDS:3}

  metrics:
    # Off by default. A full run costs several minutes of local model time, and a service that
    # measured itself on every restart would be a service nobody could restart.
    enabled: ${CARD_METRICS_ENABLED:false}
    # The reference set declares its own cheap subset, because a local model is slow enough that
    # measuring everything is a measure nobody performs.
    full-set: ${CARD_METRICS_FULL_SET:false}

  temporal:    # "local" runs an in-process server; otherwise host:port of the compose stack.
    target: ${CARD_TEMPORAL_TARGET:local}
    namespace: ${CARD_TEMPORAL_NAMESPACE:default}
    task-queue: ${CARD_TEMPORAL_TASK_QUEUE:card-drafting}
    result-timeout: ${CARD_TEMPORAL_RESULT_TIMEOUT:PT0.5S}

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.carddraft: INFO
  structured:
    format:
      # One JSON object per line rather than one line of prose, so logs can be filtered,
      # grouped and graphed without parsing text. The MDC (which carries the request and job
      # identifiers) is merged into every record.
      console: ecs
    ecs:
      service:
        name: card-drafting-service
