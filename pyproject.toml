[project]
name = "llm-developer-project-432"
version = "0.1.0"
description = "AI generator for product cards from supplier documents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2",
  "temporalio>=1.9",
  "httpx>=0.27",
  "structlog>=24.1",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]
[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.0",
  "ruff>=0.5",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "migrations"]