[project]
name = "product-card-ai"
version = "0.1.0"
description = "Сервис, который превращает документы поставщиков в черновик карточки товара"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.2,<1",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "temporalio>=1.14,<2",
    "structlog>=24.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "sentence-transformers>=3.0",
    # torch объявлен прямо, хотя приходит с sentence-transformers: иначе к нему не
    # привязать источник ниже, и установка тянет CUDA-стек на полтора гигабайта.
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.14",
]

# Модель эмбеддингов работает на cpu (см. EMBED_DEVICE в .env.example: на Apple Metal
# torch падает в дочерних процессах). Колёса с CUDA поэтому не нужны ни на одной машине.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
# Границы сервиса ловят широко намеренно: воркер не должен падать целиком из-за одного
# шага, а детектор инъекций при своём отказе обязан закрыться, а не пропустить фрагмент.
ignore = ["BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
